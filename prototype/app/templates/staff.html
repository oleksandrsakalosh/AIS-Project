{% extends 'base.html' %}
{% block title %}Zamestnanecký portál{% endblock %}
{% block content %}
<section class="staff-panel">
  <h1>Zamestnanecký portál</h1>
  <p>V rozvrhu nájdete kapacitu a počet voľných miest na tréningoch.</p>
  <div class="staff-links">
    <a class="button button-primary" href="/schedule">Zobraziť rozvrh</a>
    {% if user.role == 'admin' %}
    <a class="button button-outline" href="/admin/accounts">Spravovať účty</a>
    <a class="button button-outline" href="/admin/catalog">Spravovať katalóg</a>
    {% endif %}
  </div>
</section>
{% endblock %}
